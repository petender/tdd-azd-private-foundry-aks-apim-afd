apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  namespace: chat-app
  labels:
    app: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-app
  template:
    metadata:
      labels:
        app: chat-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: chat-app-sa
      containers:
        - name: chat-app
          image: REGISTRY_PLACEHOLDER/foundrychat:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: FOUNDRY_PROJECT_ENDPOINT
            - name: FOUNDRY_AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: FOUNDRY_AGENT_ID
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
